name: WeChat Weread Scan (manual)
# 手动触发扫码登录微信读书: 生成 weread.qq.com 登录二维码 → 发邮箱 + 存 artifact → 用户扫码
# → 捉 wr_* cookie 存 /tmp/we-mp-rss-data/weread.json(cache 持久化, 供主 daily 公众号抓取)。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: /tmp/we-mp-rss-data
          key: weread-cookie-cache
          restore-keys: |
            weread-cookie-cache-

      - run: pip install -r requirements.txt
      - name: Setup Playwright
        run: |
          pip install playwright
          python -m playwright install chromium

      # 微信读书扫码登录, 捉 wr_* cookie
      - name: Weread login
        run: python tools/weread_full_login.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      # 存二维码/整页截图/诊断为 artifact(若邮箱附件不对, 从 Actions 下载查看)
      - uses: actions/upload-artifact@v4
        with:
          name: weread-login-assets
          path: |
            tools/_wr_qr.png
            tools/_wr_page.png
            tools/_wr_diag.png
          if-no-files-found: ignore

      - uses: actions/cache@v4
        with:
          path: /tmp/we-mp-rss-data
          key: weread-cookie-cache

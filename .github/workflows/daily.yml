name: TJU Daily Bot
on:
  schedule:
    # 每 2 小时抓取 (UTC); main.py 按北京时间判断, 北京6:00那轮额外生成当日汇总
    - cron: '0 */2 * * *'
    # 每天早 6:00 北京时间 = UTC 22:00 (触发; main.py 检测北京6:00生成当日汇总)
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 恢复微信读书登录态(weread.json, 由 scan_weread 手动扫码产生)
      - uses: actions/cache@v4
        with:
          path: /tmp/we-mp-rss-data
          key: weread-cookie-cache
          restore-keys: |
            weread-cookie-cache-

      - run: pip install -r requirements.txt

      - name: Run main pipeline
        run: |
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          python src/main.py
        env:
          CI: true
          # 公众号抓取用微信读书方案(读 weread.json 的 wr_* cookie)
          WEREAD_SESSION_PATH: /tmp/we-mp-rss-data/weread.json
          # 测试样本: 公众号只抓前 5 个(为验证/调试; 全量时删掉或设更大)
          WECHAT_SAMPLE: 5
          # TJU 开源大模型平台（主模型 + 检查器）
          TJU_API_KEY: ${{ secrets.TJU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

      - name: Push output/ and state.json
        run: |
          set +e
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          mkdir -p output output/summary
          [ -f state.json ] || echo '{}' > state.json
          git add output/ state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: daily report $(date +%Y-%m-%d)" || echo "No changes to commit"
            git pull --rebase origin main || echo "Conflict, skip push"
            git push origin main || echo "Push failed, check manually"
          else
            echo "No changes to commit"
          fi

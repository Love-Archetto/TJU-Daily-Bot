name: TJU Daily Bot
on:
  # 已停自动任务：日报改为只在本地跑(Run-Daily.bat / main.py)。
  # 保留手动触发(workflow_dispatch)，需要时可在 GitHub → Actions → Run workflow 手动跑。
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt
      # 公众号正文渲染需要 Playwright(纯 requests 拿不到 mp.weixin 正文, JS 动态渲染)
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Run main pipeline
        run: |
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          python src/main.py
        env:
          CI: true
          # 手动触发(workflow_dispatch)时强制绕过 2h 控闸, 便于手动调试
          RUN_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          # 公众号抓取凭据(公开方案): 从 GitHub Secret 读, 用户手动填微信读书 wr_* cookie
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          # 全量抓取全部公众号(不设 WECHAT_SAMPLE → fetch_wechat_articles 不截断)
          # TJU 开源大模型平台（主模型 + 检查器）
          TJU_API_KEY: ${{ secrets.TJU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # 每日汇总邮件发送
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      - name: Push output/ and state.json
        run: |
          set +e
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          mkdir -p output output/summary
          [ -f state.json ] || echo '{}' > state.json
          git add output/ state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: daily report $(date +%Y-%m-%d)" || echo "No changes to commit"
            git pull --rebase origin main || echo "Conflict, skip push"
            git push origin main || echo "Push failed, check manually"
          else
            echo "No changes to commit"
          fi

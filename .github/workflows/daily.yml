name: TJU Daily Bot
on:
  schedule:
    # 每天早上 6:00 北京时间 (UTC 22:00 前一天; GitHub cron 用 UTC，中国无夏令时恒定正确)
    - cron: '0 22 * * *'
  workflow_dispatch:
# 允许 GITHUB_TOKEN 写回仓库(output/ 和 state.json push 所需)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt

      # 临时验证: 云端能否按 we-mp-rss 方法拿到登录二维码(web 多篇模式云端可复活?)
      - name: Test we-mp-rss QR (cloud)
        run: python tools/test_wemp_qr_cloud.py || true

      - name: Run main pipeline
        run: |
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          python src/main.py
        env:
          CI: true
          # 测试样本: 公众号只抓前 5 个(为验证/调试; 全量时删掉或设更大)
          WECHAT_SAMPLE: 5
          # TJU 开源大模型平台（主模型 + 检查器）
          TJU_API_KEY: ${{ secrets.TJU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

      - name: Push output/ and state.json
        run: |
          set +e
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          # 兼容 output/ 或 state.json 尚未生成的首次运行
          mkdir -p output
          [ -f state.json ] || echo '{}' > state.json
          git add output/ state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: daily report $(date +%Y-%m-%d)" || echo "No changes to commit"
            git pull --rebase origin main || echo "Conflict, skip push"
            git push origin main || echo "Push failed, check manually"
          else
            echo "No changes to commit"
          fi

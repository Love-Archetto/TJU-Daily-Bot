name: TJU Daily Bot
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
# 允许 GITHUB_TOKEN 写回仓库(output/ 和 state.json push 所需)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt

      # 诊断 TJU API 在云端的连通性（确认 AI 模型可用；不通则走 deepseek 降级）
      - name: Diagnose TJU API
        run: python tools/test_tju_api.py || true
        env:
          TJU_API_KEY: ${{ secrets.TJU_API_KEY }}
          TJU_API_BASE: https://ai.tju.edu.cn/api/v3

      - name: Run main pipeline
        run: |
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          python src/main.py
        env:
          CI: true
          # TJU 开源大模型平台（主模型 + 检查器）
          TJU_API_KEY: ${{ secrets.TJU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

      - name: Push output/ and state.json
        run: |
          set +e
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          # 兼容 output/ 或 state.json 尚未生成的首次运行
          mkdir -p output
          [ -f state.json ] || echo '{}' > state.json
          git add output/ state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: daily report $(date +%Y-%m-%d)" || echo "No changes to commit"
            git pull --rebase origin main || echo "Conflict, skip push"
            git push origin main || echo "Push failed, check manually"
          else
            echo "No changes to commit"
          fi

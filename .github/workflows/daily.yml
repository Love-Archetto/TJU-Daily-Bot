name: TJU Daily Bot
on:
  schedule:
    # 每 2 小时抓取 (UTC); main.py 按北京时间判断, 北京6:00那轮额外生成当日汇总
    - cron: '0 */2 * * *'
    # 每天早 6:00 北京时间 = UTC 22:00 (触发; main.py 检测北京6:00生成当日汇总)
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt
      # 公众号正文渲染需要 Playwright(纯 requests 拿不到 mp.weixin 正文, JS 动态渲染)
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Run main pipeline
        run: |
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          python src/main.py
        env:
          CI: true
          # 公众号抓取凭据(公开方案): 从 GitHub Secret 读, 用户手动填微信读书 wr_* cookie
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          # 测试样本: 公众号只抓前 10 个(为验证/调试; 全量时删掉或设更大)
          WECHAT_SAMPLE: 10
          # TJU 开源大模型平台（主模型 + 检查器）
          TJU_API_KEY: ${{ secrets.TJU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          # 每日汇总邮件发送
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      - name: Push output/ and state.json
        run: |
          set +e
          git config user.name "TJU Bot"
          git config user.email "bot@tju.edu"
          mkdir -p output output/summary
          [ -f state.json ] || echo '{}' > state.json
          git add output/ state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: daily report $(date +%Y-%m-%d)" || echo "No changes to commit"
            git pull --rebase origin main || echo "Conflict, skip push"
            git push origin main || echo "Push failed, check manually"
          else
            echo "No changes to commit"
          fi

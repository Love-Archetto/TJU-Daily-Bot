name: WeChat Scan Auth (manual)
# 手动触发扫码登录: 用户方便时 Run workflow → 云端 Playwright 生成微信公众平台登录二维码
# → 发到邮箱 → 用户扫码 → 捕捉会话保存到 /tmp/we-mp-rss-data/session.json(供主 daily 用)。
# 绕开 we-mp-rss 内部坏的扫码接口(独立 Playwright 已证云端能生成码)。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 恢复之前会话所在目录(可选; 若 later 用 we-mp-rss 才需要, 现在独立登录先空)
      - uses: actions/cache@v4
        with:
          path: /tmp/we-mp-rss-data
          key: wmp-session-cache
          restore-keys: |
            wmp-session-cache-

      - run: pip install -r requirements.txt
      - name: Setup Playwright
        run: |
          pip install playwright
          python -m playwright install chromium

      # 完整扫码登录: 生成码→发邮箱→等扫码→捉会话
      - name: Full WeChat login
        run: python tools/wemp_full_login.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

      # 验证: 严格复刻 web.py(session+verify=False+完整headers)+appmsgpublish, 换确定存在的号测
      - name: Test fetch with session
        run: python tools/fetch_gzh_test.py --limit 3 --interval 3 --backoff 8 --accounts "天大官微,天外天,天大就业" || true

      # 存缓存(会话), 供主 daily 恢复
      - uses: actions/cache@v4
        with:
          path: /tmp/we-mp-rss-data
          key: wmp-session-cache
